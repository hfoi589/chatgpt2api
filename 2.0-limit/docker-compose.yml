services:
  app:
    image: ghcr.io/hfoi589/chatgpt2api:2.0.0-limit
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
